services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackjack-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/blackjack
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/blackjack
      SPRING_R2DBC_USERNAME: blackjack
      SPRING_R2DBC_PASSWORD: blackjackpass
    depends_on:
      mongodb:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: blackjack-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - blackjack-mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: blackjack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: blackjack
      MYSQL_USER: blackjack
      MYSQL_PASSWORD: blackjackpass
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - blackjack-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    restart: unless-stopped

volumes:
  blackjack-mongo-data:
  blackjack-mysql-data:
